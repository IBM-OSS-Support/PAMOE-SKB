services:
  bamoe_canvas:
    image: quay.io/bamoe/canvas:9.6.0-ibm-0004
    container_name: bamoe_canvas
    platform: linux/amd64
    ports:
      - "9090:8080"
    depends_on:
      - bamoe_cors_proxy
      - bamoe_extended_services
    volumes:
      - ./repos:/git
    environment:
      - KIE_SANDBOX_EXTENDED_SERVICES_URL=http://localhost:21345
      - KIE_SANDBOX_CORS_PROXY_URL=http://localhost:7081
    networks:
      - bamoe-net

  bamoe_management_console:
    image: quay.io/bamoe/management-console:9.6.0-ibm-0004
    container_name: bamoe_management_console
    platform: linux/amd64
    ports: ["9191:8080"]
    volumes:
      - ./repos:/git
    networks: [bamoe-net]

  bamoe_cors_proxy:
    image: quay.io/bamoe/cors-proxy:9.6.0-ibm-0004
    container_name: bamoe_cors_proxy
    platform: linux/amd64
    ports: ["7081:8080"]
    networks: [bamoe-net]

  bamoe_maven_repository:
    image: quay.io/bamoe/maven-repository:9.6.0-ibm-0004
    container_name: bamoe_maven_repository
    platform: linux/amd64
    ports: ["10099:8080"]
    networks: [bamoe-net]

  bamoe_extended_services:
    image: quay.io/bamoe/extended-services:9.6.0-ibm-0004
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/pamoeskb
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=postgres
    container_name: bamoe_extended_services
    platform: linux/amd64
    ports: ["21345:21345"]
    networks: [bamoe-net]
    depends_on:
      postgres_init:
        condition: service_completed_successfully

  workflows:
    image: quay.io/pamoeskb/automated-workflows:9.4.3
    container_name: workflows
    platform: linux/amd64
    volumes:
      - ./repos:/export                 # output: repos/ folder created in customer's pwd
    command: >
      sh -c "
        set -e;
        IMAGE_SRC=/automation-workflows;

        echo 'Copying automation workflows from image to /export...';
        for workflow_dir in \$$IMAGE_SRC/*-Automated-Workflow; do
          if [ -d \"\$$workflow_dir\" ]; then
            workflow_name=\$$(basename \"\$$workflow_dir\");
            echo \"Copying \$$workflow_name from image...\";
            mkdir -p \"/export/\$$workflow_name\";
            cp -R \"\$$workflow_dir/\". \"/export/\$$workflow_name/\";
          fi;
        done;

        echo 'Removing any target/ folders from /export...';
        find /export -depth -type d -name target -exec rm -rf {} + 2>/dev/null || true;

        echo 'Updating localhost to host.docker.internal in application.properties files...';
        find /export -name 'application.properties' -type f -exec sed -i 's/localhost:5433/host.docker.internal:5433/g' {} +;
        find /export -name 'application.properties' -type f -exec sed -i 's/localhost:9092/host.docker.internal:9092/g' {} +;
        find /export -name 'application.properties' -type f -exec sed -i 's/localhost:6379/host.docker.internal:6379/g' {} +;
        find /export -name 'application.properties' -type f -exec sed -i 's/quarkus.mailer.host=localhost/quarkus.mailer.host=host.docker.internal/g' {} +;

        echo 'Collecting SQL init scripts into /export/initdb...';
        rm -rf /export/initdb;
        mkdir -p /export/initdb;
        for f in \$$IMAGE_SRC/*-Automated-Workflow/initdb/*.sql; do
          if [ -f \"\$$f\" ]; then
            base=\$$(basename \"\$$f\");
            case \"\$$base\" in
              003_correlation_instances.sql)
                echo \"Skipping Flyway runtime schema script \$$f\";
                continue;
                ;;
            esac
            if [ -f \"/export/initdb/\$$base\" ]; then
              echo \"Init script \$$base already exists, skipping\";
              continue;
            fi;
            echo \"Copying \$$f to /export/initdb/\$$base\";
            cp \"\$$f\" \"/export/initdb/\$$base\";
          fi;
        done;

        echo 'Copying swidtag from image to /export and all workflow directories...';
        for swidtag in \$$IMAGE_SRC/*.swidtag; do
          if [ -f \"\$$swidtag\" ]; then
            cp \"\$$swidtag\" /export/;
            for workflow_dir in /export/*-Automated-Workflow; do
              [ -d \"\$$workflow_dir\" ] && cp \"\$$swidtag\" \"\$$workflow_dir/\";
            done;
            echo \"Copied swidtag: \$$(basename \"\$$swidtag\")\";
          fi;
        done;

        echo 'Copying bamoe-mcp from image to /export...';
        if [ -d \$$IMAGE_SRC/bamoe-mcp ]; then
          rm -rf /export/bamoe-mcp;
          cp -R \$$IMAGE_SRC/bamoe-mcp /export/bamoe-mcp;
          echo 'bamoe-mcp copied to /export/bamoe-mcp';
        fi;

        echo 'Export done';
      "
    networks: [bamoe-net]

  kafka:
    image: quay.io/pamoeskb/kafka:4.3.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT_INTERNAL://:29092,PLAINTEXT_EXTERNAL://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_INTERNAL://kafka:29092,PLAINTEXT_EXTERNAL://host.docker.internal:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    networks:
      - bamoe-net

  mailpit:
    image: quay.io/pamoeskb/mailpit:v1.30.0
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [bamoe-net]

  postgres:
    image: quay.io/pamoeskb/postgres:18.4
    container_name: pg-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: pamoeskb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    depends_on:
      workflows:
        condition: service_completed_successfully
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - bamoe-net

  postgres_init:
    image: quay.io/pamoeskb/postgres:18.4
    container_name: pg-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_DB: pamoeskb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./repos/initdb:/initdb:ro
    networks:
      - bamoe-net
    entrypoint: >
      sh -c '
        set -e
        echo "SQL files in /initdb:"
        ls -l /initdb || echo "No initdb scripts found"

        if [ -f "/initdb/00_schema.sql" ]; then
          echo "Running schema script first: /initdb/00_schema.sql"
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 \
            -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
            -f "/initdb/00_schema.sql"
        fi

        for f in /initdb/*.sql; do
          if [ ! -f "$$f" ]; then
            continue
          fi
          if [ "$$f" = "/initdb/00_schema.sql" ]; then
            continue
          fi
          echo "Running init script: $$f"
          PGPASSWORD="$$POSTGRES_PASSWORD" psql -v ON_ERROR_STOP=1 \
            -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" \
            -f "$$f"
        done

        echo "Database init completed."
      '

  redis:
    container_name: redis
    image: quay.io/pamoeskb/redis:8.8.0-fixed
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [bamoe-net]

networks:
  bamoe-net:
    driver: bridge

volumes:
  pg_data:
  redis-data: